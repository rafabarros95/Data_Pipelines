services:
  postgres:
    image: postgres:16
    container_name: data_pipelines_postgres
    environment:
      POSTGRES_DB: covid_19_db
      POSTGRES_USER: rb
      POSTGRES_PASSWORD: covid123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U your_user -d your_db_name"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata: